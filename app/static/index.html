<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Context Translator · UX V2</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --brand: #2563eb;
        --brand-2: #1d4ed8;
        --line: #dbe3ef;
        --danger: #b91c1c;
        --ok: #166534;

        --reflow-font-size: 21px;
        --reflow-line-height: 1.92;
        --reflow-width: 760px;
        --reflow-pad-x: 54px;
        --reflow-pad-y: 44px;
        --reflow-theme-bg: #fffdf7;
        --reflow-theme-text: #1f2937;
        --reflow-theme-border: #ece7da;
        --reflow-theme-shadow: rgba(15, 23, 42, 0.08);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(255,255,255,0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        padding: 10px 14px;
      }
      .topbar-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .chip, .btn, .seg button, input, select {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        border-radius: 10px;
        font-size: 13px;
      }
      .chip { padding: 6px 10px; color: var(--muted); }
      .btn { padding: 7px 11px; cursor: pointer; }
      .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
      .btn.primary:hover { background: var(--brand-2); }
      .btn.ghost { background: #f8fafc; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      .seg button { border: none; border-right: 1px solid var(--line); border-radius: 0; padding: 7px 10px; cursor: pointer; }
      .seg button:last-child { border-right: none; }
      .seg button.active { background: #dbeafe; color: #1e3a8a; font-weight: 600; }

      #gotoPageInput { width: 88px; padding: 7px 8px; }
      #pageJumpBtn { padding: 7px 10px; }
      #searchInput { width: 190px; padding: 7px 10px; }
      #bookshelfSelect { max-width: 220px; padding: 7px 10px; }

      .main {
        display: grid;
        grid-template-columns: minmax(0,1fr) 360px;
        gap: 12px;
        padding: 12px;
      }

      .reader-wrap {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        min-height: calc(100vh - 96px);
        overflow: auto;
        padding: 12px;
      }
      #pdfHost, #reflowHost {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      #pdfHost.hidden, #reflowHost.hidden { display: none; }
      .page {
        position: relative;
        background: white;
        margin: 0 auto;
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      }
      .page canvas, .textLayer, .gloss-layer { position: absolute; inset: 0; }
      .textLayer { z-index: 2; }
      .textLayer span {
        position: absolute;
        color: rgba(0,0,0,0.01);
        cursor: pointer;
        border-radius: 3px;
      }
      .textLayer span:hover { background: rgba(37,99,235,.14); }
      .textLayer span.annotated { background: rgba(59,130,246,.22); }
      .textLayer span.known { outline: 1px solid rgba(34,197,94,.18); }
      .textLayer span.autoMark { background: rgba(250,204,21,.12); }
      .gloss-layer { z-index: 4; pointer-events: none; }
      .gloss-inline {
        position: absolute;
        min-width: 132px;
        max-width: 260px;
        border-radius: 8px;
        border: 1px solid #bfdbfe;
        background: rgba(239,246,255,.98);
        box-shadow: 0 6px 18px rgba(30,64,175,.16);
        padding: 5px 7px;
        font-size: 12px;
        line-height: 1.3;
        pointer-events: auto;
      }
      .gloss-inline .head { display: flex; justify-content: space-between; gap: 8px; }
      .gloss-inline .word { font-weight: 700; color: #1e3a8a; }
      .gloss-inline .zh { font-weight: 600; }
      .gloss-inline .ctx { color: #334155; margin-top: 3px; }
      .gloss-inline .close {
        border: none; background: transparent; color: #64748b; cursor: pointer; font-weight: 700;
      }
      .gloss-inline.error { border-color: #fecaca; background: #fff1f2; }

      .reflow-page {
        width: min(var(--reflow-width), calc(100vw - 490px));
        margin: 0 auto;
        background: var(--reflow-theme-bg);
        border-radius: 6px;
        box-shadow: 0 8px 20px var(--reflow-theme-shadow);
        border: 1px solid var(--reflow-theme-border);
        padding: var(--reflow-pad-y) var(--reflow-pad-x);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        line-height: var(--reflow-line-height);
        font-size: var(--reflow-font-size);
        color: var(--reflow-theme-text);
        letter-spacing: 0.01em;
      }
      .reflow-page p {
        margin: 0;
        text-align: justify;
        text-justify: inter-word;
      }
      .reflow-page p + p { margin-top: 0.85em; }
      .reflow-page p.indent { text-indent: 1.8em; }

      .word-token { cursor: pointer; border-radius: 3px; }
      .word-token:hover { background: #fbe7b8; }
      .word-token.active { background: #f5d88e; }
      .word-token.known { outline: 1px solid rgba(34,197,94,.18); }
      .reflow-gloss {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 6px;
        border: 1px solid #d8c089;
        background: #f8e9c8;
        color: #5b3f1b;
        border-radius: 999px;
        padding: 1px 8px;
        font-size: .7em;
      }
      .reflow-gloss.known { border-color: rgba(34,197,94,.38); background: rgba(187,247,208,.38); color: #14532d; }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        min-height: calc(100vh - 96px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-head {
        position: sticky;
        top: 0;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: #fff;
        z-index: 2;
      }
      .panel-head h3 { margin: 0 0 8px; font-size: 15px; }
      .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      .tab-btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
      .tab-btn.active { background: #dbeafe; color: #1e3a8a; border-color: #bfdbfe; font-weight: 600; }
      .panel-body { padding: 10px; overflow: auto; }
      .panel-section.hidden { display: none; }

      .annotation-list { display: flex; flex-direction: column; gap: 8px; }
      .anno-card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        background: #fbfdff;
      }
      .anno-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
      .anno-word { font-weight: 700; }
      .anno-meta { color: var(--muted); font-size: 12px; }
      .anno-zh { color: #1e3a8a; font-weight: 600; font-size: 13px; }
      .anno-ctx { color: #334155; font-size: 12px; margin-top: 3px; }
      .anno-actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
      .anno-actions button { border: 1px solid var(--line); background: #fff; border-radius: 8px; font-size: 12px; padding: 4px 7px; cursor: pointer; }
      .anno-actions .danger { color: var(--danger); }
      .empty { color: var(--muted); font-size: 13px; padding: 20px 4px; }
      .status-ok { color: var(--ok); }
      .status-err { color: var(--danger); }

      .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      .row .left { display: flex; flex-direction: column; gap: 2px; }
      .row .title { font-weight: 700; }
      .row .sub { color: var(--muted); font-size: 12px; }
      .row .right { display: flex; align-items: center; gap: 6px; }
      .pill { border: 1px solid var(--line); background: #f8fafc; border-radius: 999px; padding: 3px 8px; font-size: 12px; color: var(--muted); }

      .toast {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15,23,42,.94);
        color: #fff;
        border-radius: 12px;
        padding: 10px 12px;
        display: none;
        z-index: 80;
        max-width: calc(100vw - 24px);
      }
      .toast .actions { margin-top: 6px; display: flex; gap: 8px; }
      .toast button { border: 1px solid rgba(255,255,255,.22); background: transparent; color: #fff; border-radius: 10px; padding: 5px 10px; cursor: pointer; }

      #panelToggle { display: none; }

      @media (max-width: 1040px) {
        .main { grid-template-columns: 1fr; }
        .reflow-page { width: calc(100vw - 28px); padding: 18px 14px; font-size: 18px; }
        .panel {
          position: fixed;
          right: 8px;
          left: 8px;
          bottom: 8px;
          top: 110px;
          transform: translateY(108%);
          transition: transform .22s ease;
          z-index: 50;
          min-height: auto;
        }
        .panel.open { transform: translateY(0); }
        #panelToggle { display: inline-block; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-row">
          <input id="pdfInput" class="btn" type="file" accept="application/pdf" />
          <select id="bookshelfSelect" title="Bookshelf"></select>
          <span class="chip" id="pageCount">Pages: 0</span>
          <span class="chip" id="statusHint">就绪</span>
          <div class="seg" role="tablist" aria-label="Reading mode">
            <button id="modeOriginal" class="active" role="tab" aria-selected="true">原始 PDF</button>
            <button id="modeReflow" role="tab" aria-selected="false">重排阅读</button>
          </div>
          <button id="prevPageBtn" class="btn ghost">上一页</button>
          <button id="nextPageBtn" class="btn ghost">下一页</button>
          <input id="gotoPageInput" type="number" min="1" placeholder="页码" />
          <button id="pageJumpBtn" class="btn">跳转</button>
          <input id="searchInput" placeholder="搜索(英文)" />
          <button id="searchBtn" class="btn">搜索</button>
          <button id="panelToggle" class="btn">侧栏</button>
        </div>
      </header>

      <div class="main">
        <section class="reader-wrap" id="readerWrap">
          <div id="pdfHost"></div>
          <div id="reflowHost" class="hidden"></div>
        </section>

        <aside class="panel" id="annotationPanel">
          <div class="panel-head">
            <h3 id="panelTitle">本书</h3>
            <div class="tabs">
              <button class="tab-btn active" data-tab="annos">注释</button>
              <button class="tab-btn" data-tab="vocab">词汇</button>
              <button class="tab-btn" data-tab="search">搜索</button>
              <button class="tab-btn" data-tab="settings">设置</button>
            </div>
            <div class="topbar-row" style="margin-top:8px;">
              <button id="jumpLastBtn" class="btn">跳到最近翻译</button>
              <button id="exportBtn" class="btn">导出</button>
              <button id="importBtn" class="btn">导入</button>
              <input id="importInput" type="file" accept="application/json" style="display:none" />
              <button id="clearAllBtn" class="btn">清空本书注释</button>
            </div>
          </div>

          <div class="panel-body">
            <section class="panel-section" id="tabAnnos">
              <div class="annotation-list" id="annotationList"></div>
              <div class="empty" id="annotationEmpty">点击单词后，翻译注释会出现在这里，并自动保存。</div>
            </section>

            <section class="panel-section hidden" id="tabVocab">
              <div class="kv">
                <label class="chip"><input type="checkbox" id="hideKnown" /> 隐藏已掌握</label>
                <span class="chip" id="vocabCount">0 words</span>
              </div>
              <div style="height:10px"></div>
              <div id="vocabList" class="annotation-list"></div>
              <div class="empty" id="vocabEmpty">还没有词汇。点击单词进行翻译后，这里会形成可复习的词表。</div>
            </section>

            <section class="panel-section hidden" id="tabSearch">
              <div class="chip" id="searchHint">输入搜索词(英文)，点击上方“搜索”。</div>
              <div style="height:10px"></div>
              <div id="searchResults" class="annotation-list"></div>
              <div class="empty" id="searchEmpty" style="display:none">没有找到结果。</div>
            </section>

            <section class="panel-section hidden" id="tabSettings">
              <div class="annotation-list">
                <div class="row">
                  <div class="left">
                    <div class="title">重排字号</div>
                    <div class="sub">影响重排阅读模式</div>
                  </div>
                  <div class="right">
                    <input id="fontSize" type="range" min="16" max="30" step="1" />
                    <span class="pill" id="fontSizeVal"></span>
                  </div>
                </div>

                <div class="row">
                  <div class="left">
                    <div class="title">行距</div>
                    <div class="sub">更大行距更易读</div>
                  </div>
                  <div class="right">
                    <input id="lineHeight" type="range" min="1.4" max="2.2" step="0.05" />
                    <span class="pill" id="lineHeightVal"></span>
                  </div>
                </div>

                <div class="row">
                  <div class="left">
                    <div class="title">版心宽度</div>
                    <div class="sub">控制每行字符数</div>
                  </div>
                  <div class="right">
                    <input id="pageWidth" type="range" min="560" max="900" step="10" />
                    <span class="pill" id="pageWidthVal"></span>
                  </div>
                </div>

                <div class="row">
                  <div class="left">
                    <div class="title">主题</div>
                    <div class="sub">纸张 / 深色</div>
                  </div>
                  <div class="right">
                    <select id="themeSelect">
                      <option value="paper">Paper</option>
                      <option value="dark">Dark</option>
                    </select>
                  </div>
                </div>

                <div class="row">
                  <div class="left">
                    <div class="title">自动标记已掌握</div>
                    <div class="sub">在正文里轻量标记已掌握单词</div>
                  </div>
                  <div class="right">
                    <label class="chip"><input type="checkbox" id="autoMarkKnown" /> 开启</label>
                  </div>
                </div>

                <div class="row">
                  <div class="left">
                    <div class="title">自动翻译(轻量)</div>
                    <div class="sub">重排模式下：点击后才真正保存；自动只做视觉提示</div>
                  </div>
                  <div class="right">
                    <select id="autoTranslateMode">
                      <option value="off">Off</option>
                      <option value="underline">Underline unknown</option>
                      <option value="limit10">Auto-translate up to 10 per page</option>
                    </select>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </aside>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
